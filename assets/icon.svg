<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Shield Core Gradient -->
    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neural Circuit Gradient -->
    <linearGradient id="cyberCircuit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Keyhole / Mask Core Glow -->
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container / Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="108" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Background Tech Grid Rings -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.3" />

  <!-- Shield Outer Glow & Shape -->
  <path d="M256 68 
           C348 68, 412 110, 412 216 
           C412 328, 320 404, 256 444 
           C192 404, 100 328, 100 216 
           C100 110, 164 68, 256 68 Z" 
        fill="none" 
        stroke="url(#shieldBorder)" 
        stroke-width="12" 
        filter="url(#neonGlow)" />

  <path d="M256 74 
           C344 74, 404 114, 404 216 
           C404 322, 316 396, 256 434 
           C196 396, 108 322, 108 216 
           C108 114, 168 74, 256 74 Z" 
        fill="url(#shieldFill)" 
        stroke="url(#shieldBorder)" 
        stroke-width="3" />

  <!-- Inner Cyber Mesh / Quantum Lines inside Shield -->
  <g opacity="0.45" stroke="#38bdf8" stroke-width="1.5">
    <line x1="256" y1="110" x2="256" y2="160" />
    <line x1="180" y1="160" x2="230" y2="185" />
    <line x1="332" y1="160" x2="282" y2="185" />
    <line x1="160" y1="240" x2="200" y2="240" />
    <line x1="352" y1="240" x2="312" y2="240" />
    <line x1="190" y1="330" x2="230" y2="350" />
    <line x1="322" y1="330" x2="282" y2="350" />
    <circle cx="180" cy="160" r="3.5" fill="#38bdf8" />
    <circle cx="332" cy="160" r="3.5" fill="#38bdf8" />
    <circle cx="160" cy="240" r="3.5" fill="#38bdf8" />
    <circle cx="352" cy="240" r="3.5" fill="#38bdf8" />
    <circle cx="190" cy="330" r="3.5" fill="#38bdf8" />
    <circle cx="322" cy="330" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Shadow Agent Stylized Visor / Cloak Mask -->
  <path d="M168 198 
           Q256 220 344 198 
           Q332 268 256 292 
           Q180 268 168 198 Z" 
        fill="#090d16" 
        stroke="url(#shieldBorder)" 
        stroke-width="4" 
        filter="url(#subtleGlow)" />

  <!-- Glowing Agent Visor Eyes (Cyber Optical Sensor) -->
  <path d="M196 225 Q226 235 244 225" fill="none" stroke="url(#eyeGlow)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M268 225 Q286 235 316 225" fill="none" stroke="url(#eyeGlow)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Central Quantum / Keyhole Core (Zero-Knowledge Privacy Vault) -->
  <circle cx="256" cy="334" r="16" fill="url(#eyeGlow)" filter="url(#neonGlow)" />
  <polygon points="250,334 262,334 268,368 244,368" fill="url(#eyeGlow)" />
  <circle cx="256" cy="334" r="7" fill="#090d16" />

  <!-- Shield Top Crown Accent Indicator -->
  <circle cx="256" cy="110" r="6" fill="#38bdf8" filter="url(#neonGlow)" />
  <circle cx="256" cy="110" r="2.5" fill="#ffffff" />
</svg>
