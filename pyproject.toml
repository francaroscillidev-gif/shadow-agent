[project]
name = "shadow-agent"
version = "0.1.0"
description = "Local Privacy Guard & Masking Proxy for LLMs"
readme = "README.md"
authors = [
    { name = "Franca Roscilli", email = "francaroscillidev@gmail.com" }
]
urls = { "Homepage" = "https://github.com/francaroscillidev-gif/shadow-agent", "Repository" = "https://github.com/francaroscillidev-gif/shadow-agent" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shadow-agent = "shadow_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]
